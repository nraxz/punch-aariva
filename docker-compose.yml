# Local Docker stack for Aariva Punch (Kimai).
# Start with: ./docker-start.sh
# Or: docker compose --env-file .env.docker up -d --build

services:
  sqldb:
    image: mysql:8.3
    volumes:
      - mysql:/var/lib/mysql
    ports:
      # Host access for DBeaver / local clients (container still uses 3306)
      - "${DATABASE_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-kimai}
      MYSQL_USER: ${DATABASE_USER:-kimai}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-kimai}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-kimai}
    command: --default-storage-engine innodb
    restart: unless-stopped
    healthcheck:
      test: mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kimai:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        BASE: apache
        KIMAI: local
    depends_on:
      sqldb:
        condition: service_healthy
    volumes:
      - data:/opt/kimai/var/data
      # Bind-mount local plugins so ApprovalBundle edits apply without rebuilding the named volume
      - ./var/plugins:/opt/kimai/var/plugins
    ports:
      - "${KIMAI_PORT:-8001}:8001"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_this_to_something_unique}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-^(localhost|127\.0\.0\.1)$}
      ADMINMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMINPASS: ${ADMIN_PASSWORD:-changeme}
      DATABASE_URL: mysql://${DATABASE_USER:-kimai}:${DATABASE_PASSWORD:-kimai}@sqldb:3306/${DATABASE_NAME:-kimai}?charset=utf8mb4&serverVersion=8.3.0
      MAILER_FROM: ${MAILER_FROM:-admin@example.com}
      MAILER_URL: ${MAILER_URL:-null://localhost}
    restart: unless-stopped

volumes:
  data:
  mysql:
