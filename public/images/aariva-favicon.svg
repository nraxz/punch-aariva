<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<defs>
		<style type="text/css"><![CDATA[
			@font-face {
				font-family: 'Righteous';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('https://fonts.gstatic.com/s/righteous/v17/1cXxaULHBpDMsHYW_ESOjnGAyLMI.woff2') format('woff2');
			}
			.fv { font-family: 'Righteous', sans-serif; text-rendering: geometricPrecision; }
		]]></style>
	</defs>

	<!-- White background box with rounded corners -->
	<rect x="2" y="2" width="28" height="28" rx="4" fill="white" stroke="#244576" stroke-width="2"/>

	<!-- Centered A -->
	<text x="16" y="22" font-size="18" text-anchor="middle" class="fv" fill="#A92064">A</text>
</svg>
